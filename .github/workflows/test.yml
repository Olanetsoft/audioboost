name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Integration tests synthesize and boost real videos; without ffmpeg
      # they auto-skip, which would silently shrink coverage.
      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Run tests
        run: python3 -m unittest discover tests -v
